# External docs mirrored in as ONE page each (unlike readme, which splits into a folder).
# start_at and stop_at publish one range of a longer doc: everything before start_at and
# from stop_at onwards is dropped, which is how the internal parts of a repo doc stay
# internal. The source's own YAML front matter and HTML comments are always stripped, and
# links that cannot resolve on the garden are reduced to their text.
mirror_docs: []

# A page replaced by one with a different permalink: old permalink -> new permalink.
# The build redirects the old short URL and the old page files (write_old_url_redirects).
